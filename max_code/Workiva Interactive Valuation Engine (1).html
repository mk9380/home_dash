const C={bg:"#111",surface:"#1a1a1a",surface2:"#222",card:"#1e1e1e",border:"#333",blue:"#0078FF",blueLight:"#3399FF",green:"#00C853",greenLight:"#4ADE80",red:"#FF5252",orange:"#FFB300",purple:"#B388FF",text:"#FFF",textSec:"#B0B0B0",textDim:"#707070",

const ff="'Inter',sans-serif";
function bgs(m,s,e,y){var r=[];for(var i=0;i<y;i++){var t=y<=1?1:i/(y-1);var rate;if(m==="linear")rate=s+(e-s)*t;else if(m==="accelerating")rate=s+(e-s)*Math.pow(t,2);else if(m==="decaying")rate=s+(e-s)*(1-Math.pow(1-t,2));else{var k=8,sg=1/(1+Math.exp(-k*(t-.5))),s0=1/(1+Math.exp(-k*(-.5))),s1=1/(1+Math.exp(-k*(.5)));rate=s+(e-s)*(sg-s0)/(s1-s0);}r.push(rate/100);}return r;}
function pRev(b,rates){var r=[b];for(var i=0;i<rates.length;i++)r.push(r[r.length-1]*(1+rates[i]));return r;}
function pFCF(revs,mg){return revs.map(function(r,i){return r*(mg[Math.min(i,mg.length-1)]||mg[mg.length-1]);});}
function cDCF(fcfs,w,tg){if(w/100<=tg/100)return{pvFCF:0,pvTerminal:0,discountedFCFs:fcfs.slice(1).map(function(){return 0;}),enterpriseValue:0};var d=fcfs.slice(1).map(function(f,i){return f/Math.pow(1+w/100,i+1);});var tvF=fcfs[fcfs.length-1]*(1+tg/100);var tv=tvF/(w/100-tg/100);var pvTV=tv/Math.pow(1+w/100,fcfs.length-1);var pvFCF=d.reduce(function(a,b){return a+b;},0);return{pvFCF:pvFCF,pvTerminal:pvTV,discountedFCFs:d,enterpriseValue:pvFCF+pvTV};}
var fmt=function(n,d){d=d==null?1:d;if(n==null||isNaN(n))return"\u2014";if(Math.abs(n)>=1e9)return"$"+(n/1e9).toFixed(d)+"B";if(Math.abs(n)>=1e6)return"$"+(n/1e6).toFixed(d)+"M";return"$"+n.toFixed(d);};
var fmtB=function(n){if(n==null||isNaN(n))return"";if(Math.abs(n)>=1e3)return"$"+(n/1e3).toFixed(1)+"B";return"$"+n.toFixed(0)+"M";};
var fmtX=function(n){if(n==null||isNaN(n)||!isFinite(n))return"\u2014";return n.toFixed(1)+"x";};
var fmtNum=function(n,d){d=d==null?1:d;return(n==null||isNaN(n))?"\u2014":n.toFixed(d);};
var inputStyle={background:C.bg,border:"1px solid "+C.border,color:C.text,borderRadius:8,padding:"7px 11px",width:"100%",fontSize:13,outline:"none",fontFamily:ff,fontWeight:500};
var selectStyle={...inputStyle,cursor:"pointer"};
var labelStyle={color:C.textSec,fontSize:11,fontFamily:ff,fontWeight:600,letterSpacing:"0.04em",textTransform:"uppercase",marginBottom:4,display:"block"};
var PRESETS={bear:{label:"Bear",color:C.red,revGrowthStart:17,revGrowthEnd:0,fcfMarginStart:16,fcfMarginEnd:16,wacc:10,terminalGrowth:-2},base:{label:"Base",color:C.blue,revGrowthStart:18,revGrowthEnd:10,fcfMarginStart:19,fcfMarginEnd:30,wacc:9,terminalGrowth:1},bull:{label:"Bull",color:C.green,revGrowthStart:19,revGrowthEnd:10,fcfMarginStart:20,fcfMarginEnd:35,wacc:9,terminalGrowth:2}};
var DEFAULT_COMPS=[{name:"OneStream Inc",selected:true,sharePrice:22.74,sharesM:257,ev:5200,revLatest:586,revNtm:702,ebitdaPctLatest:null,ebitdaPctNtm:null},{name:"Blackline",selected:true,sharePrice:53.58,sharesM:74,ev:4097,revLatest:700,revNtm:751,ebitdaPctLatest:28.3,ebitdaPctNtm:24.3},{name:"Asana Inc",selected:true,sharePrice:13.32,sharesM:259,ev:3012,revLatest:787,revNtm:855,ebitdaPctLatest:null,ebitdaPctNtm:null},{name:"Freshworks Inc",selected:true,sharePrice:11.19,sharesM:317,ev:2732,revLatest:826,revNtm:947,ebitdaPctLatest:null,ebitdaPctNtm:null},{name:"SentinelOne Inc",selected:true,sharePrice:16.92,sharesM:365,ev:5026,revLatest:1000,revNtm:1217,ebitdaPctLatest:null,ebitdaPctNtm:null},{name:"Qualys",selected:false,sharePrice:149.73,sharesM:38,ev:5010,revLatest:656,revNtm:708,ebitdaPctLatest:18.0,ebitdaPctNtm:14.1},{name:"Bill.com Holdings",selected:false,sharePrice:45.59,sharesM:117,ev:4834,revLatest:1527,revNtm:1680,ebitdaPctLatest:null,ebitdaPctNtm:null},{name:"ZoomInfo Technologies Inc",selected:false,sharePrice:10.575,sharesM:336,ev:4753,revLatest:1220,revNtm:1226,ebitdaPctLatest:null,ebitdaPctNtm:null},{name:"RingCentral",selected:false,sharePrice:26.93,sharesM:102,ev:3850,revLatest:2504,revNtm:2611,ebitdaPctLatest:34.2,ebitdaPctNtm:32.6},{name:"Varonis",selected:false,sharePrice:34.14,sharesM:130,ev:3724,revLatest:618,revNtm:694,ebitdaPctLatest:8.6,ebitdaPctNtm:4.1},{name:"Kinaxis Inc",selected:false,sharePrice:126.53,sharesM:29,ev:3396,revLatest:545,revNtm:614,ebitdaPctLatest:19.9,ebitdaPctNtm:22.0},{name:"Vertex Inc",selected:false,sharePrice:19.51,sharesM:171,ev:3356,revLatest:748,revNtm:839,ebitdaPctLatest:null,ebitdaPctNtm:null},{name:"Appian Corp",selected:false,sharePrice:40.29,sharesM:75,ev:3098,revLatest:697,revNtm:787,ebitdaPctLatest:21.4,ebitdaPctNtm:15.9},{name:"Braze Inc",selected:false,sharePrice:27.99,sharesM:112,ev:2860,revLatest:708,revNtm:860,ebitdaPctLatest:null,ebitdaPctNtm:null}];

function SL(p){if(p.value==null||isNaN(p.value))return null;return <text x={p.x} y={p.y-8} fill={p.fill||"#999"} fontSize={9} fontFamily={ff} fontWeight={600} textAnchor="middle">{fmtB(p.value)}</text>;}
function SLP(p){if(p.value==null||isNaN(p.value))return null;return <text x={p.x} y={p.y-8} fill={p.fill||"#999"} fontSize={9} fontFamily={ff} fontWeight={600} textAnchor="middle">{(typeof p.value==="number"?p.value:0).toFixed(1)}</text>;}
function BIL(p){if(p.value==null||isNaN(p.value)||p.height<16)return null;return <text x={p.x+p.width/2} y={p.y+14} fill="rgba(255,255,255,0.85)" fontSize={9} fontFamily={ff} fontWeight={700} textAnchor="middle">{Math.round(p.value)}</text>;}
function EVL(p){if(p.value==null||isNaN(p.value))return null;return <text x={p.x} y={p.y-8} fill={p.fill||"#999"} fontSize={8} fontFamily={ff} fontWeight={600} textAnchor="middle">{fmtB(p.value)}</text>;}

function Slider({label,value,min,max,step,onChange,unit}){step=step||0.5;unit=unit||"%";return(<div style={{marginBottom:14}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}><span style={{...labelStyle,marginBottom:0}}>{label}</span><span style={{color:C.blue,fontSize:13,fontFamily:ff,fontWeight:700}}>{value}{unit}</span></div><input type="range" min={min} max={max} step={step} value={value} onChange={function(e){onChange(Number(e.target.value));}} style={{width:"100%",accentColor:C.blue,height:4,cursor:"pointer"}}/><div style={{display:"flex",justifyContent:"space-between"}}><span style={{color:C.textDim,fontSize:10}}>{min}{unit}</span><span style={{color:C.textDim,fontSize:10}}>{max}{unit}</span></div></div>);}
function Field({label,value,onChange,type,min,max,step}){type=type||"number";return(<div style={{marginBottom:12}}><label style={labelStyle}>{label}</label><input type={type} value={value} min={min} max={max} step={step} onChange={function(e){onChange(type==="number"?Number(e.target.value):e.target.value);}} style={inputStyle}/></div>);}
function MRow(p){return <div style={{display:"flex",justifyContent:"space-between",padding:"3px 0"}}><span style={{color:C.textSec,fontSize:10,fontWeight:500}}>{p.l}</span><span style={{color:p.c||C.text,fontSize:10,fontWeight:600}}>{p.v}</span></div>;}
function downloadCSV(cd,res,as){var h=["Year","Revenue","Growth%","Margin%","FCF","DiscFCF"];var rows=[h.join(",")];cd.forEach(function(d,i){rows.push([d.year,(res.revenues[i]/1e6).toFixed(1),i===0?"":d[as+"_growth"],d[as+"_margin"],(res.fcfs[i]/1e6).toFixed(1),i===0?"":(res.discountedFCFs[i-1]/1e6).toFixed(1)].join(","));});var b=new Blob([rows.join("\n")],{type:"text/csv"});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download="dcf_detail.csv";a.click();URL.revokeObjectURL(u);}

// Section heading: dark grey default for light bg, colored for scenario-specific
function SH(text,color,light){var defaultColor=light?"#444":"#e0e0e0";var c=color||defaultColor;var borderC=color||(light?"#bbb":"#333");return <div style={{color:c,fontSize:12,fontFamily:ff,fontWeight:700,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:12,paddingBottom:8,borderBottom:"2px solid "+borderC+"66"}}>{text}</div>;}

var chartCard={background:"#fff",border:"1px solid #555",borderRadius:12,padding:16};

var cTick={fill:"#666",fontSize:9,fontFamily:ff,fontWeight:500};

function App(){
  var[tab,setTab]=useState("home");
  var[activeSc,setActiveSc]=useState("base");
  var[coName,setCoName]=useState("Workiva");
  var[baseRev,setBaseRev]=useState(885);
  var[netCashAdj,setNetCashAdj]=useState(100);
  var[shares,setShares]=useState(58.3);
  var[projYrs,setProjYrs]=useState(10);
  var[baseYear,setBaseYear]=useState(2026);
  var[curPrice,setCurPrice]=useState(60);
  var[scenarios,setScenarios]=useState({bear:{...PRESETS.bear,revMode:"decaying",fcfMode:"linear"},base:{...PRESETS.base,revMode:"decaying",fcfMode:"decaying"},bull:{...PRESETS.bull,revMode:"accelerating",fcfMode:"decaying"}});
  var upSc=useCallback(function(k,f,v){setScenarios(function(p){var o={};o[k]={...p[k]};o[k][f]=v;return{...p,...o};});},[]);
  var[comps,setComps]=useState(DEFAULT_COMPS);
  var[sensW,setSensW]=useState([7,7.5,8,8.5,9,9.5,10,10.5,11,11.5,12,13,14,15]);
  var[sensT,setSensT]=useState([-4,-3,-2,-1,0,0.5,1,1.5,2,2.5,3,3.5,4,5]);
  var[exporting,setExporting]=useState(false);
  var curEqValue=curPrice*shares*1e6;var curEV=curEqValue-netCashAdj*1e6;

  var dcfR=useMemo(function(){var out={};Object.entries(scenarios).forEach(function(pair){var key=pair[0],sc=pair[1];var rg=bgs(sc.revMode,sc.revGrowthStart,sc.revGrowthEnd,projYrs);var fm=bgs(sc.fcfMode,sc.fcfMarginStart,sc.fcfMarginEnd,projYrs+1);var revs=pRev(baseRev*1e6,rg);var fcfs=pFCF(revs,fm);var r=cDCF(fcfs,sc.wacc,sc.terminalGrowth);var eq=r.enterpriseValue+netCashAdj*1e6;var pps=eq/(shares*1e6);var avgM=fm.reduce(function(a,b){return a+b;},0)/fm.length*100;var cagr=(Math.pow(revs[revs.length-1]/revs[0],1/projYrs)-1)*100;var tvP=r.enterpriseValue>0?(r.pvTerminal/r.enterpriseValue*100):0;var ntmR=revs[1];var ntmF=fcfs[1];var ntmG=rg[0]*100;var evRN=r.enterpriseValue/ntmR;var evFN=ntmF>0?r.enterpriseValue/ntmF:null;out[key]={revenues:revs,fcfs:fcfs,revGrowthRates:rg,fcfMarginRates:fm,pvFCF:r.pvFCF,pvTerminal:r.pvTerminal,discountedFCFs:r.discountedFCFs,enterpriseValue:r.enterpriseValue,equityValue:eq,pricePerShare:pps,avgMargin:avgM,cagr:cagr,tvPct:tvP,ntmRev:ntmR,ntmFCF:ntmF,evRevNtm:evRN,evFcfNtm:evFN,rule40:ntmG+(fm[1]*100),ntmGrowth:ntmG};});return out;},[scenarios,baseRev,netCashAdj,shares,projYrs]);

  var baseRes=dcfR.base;var curEvRevNtm=baseRes?curEV/baseRes.ntmRev:null;var curEvFcfNtm=(baseRes&&baseRes.ntmFCF>0)?curEV/baseRes.ntmFCF:null;
  var yearLabels=useMemo(function(){return[String(baseYear)].concat(Array.from({length:projYrs},function(_,i){return String(baseYear+i+1);}));},[baseYear,projYrs]);
  var chartData=useMemo(function(){return yearLabels.map(function(yr,i){var row={year:yr};Object.entries(dcfR).forEach(function(p){var k=p[0],r=p[1];row[k+"_rev"]=+(r.revenues[i]/1e6).toFixed(1);row[k+"_fcf"]=+(r.fcfs[i]/1e6).toFixed(1);row[k+"_margin"]=+(r.fcfMarginRates[i]*100).toFixed(1);row[k+"_growth"]=i>0?+(r.revGrowthRates[i-1]*100).toFixed(1):null;});return row;});},[dcfR,yearLabels]);
  var selComps=comps.filter(function(c){return c.selected;});
  var compsA=useMemo(function(){if(!selComps.length)return null;var evR=selComps.map(function(c){return c.ev/c.revNtm;});var rG=selComps.map(function(c){return(c.revNtm-c.revLatest)/c.revLatest*100;});var sort=function(a){return[].concat(a).sort(function(x,y){return x-y;});};var med=function(a){var s=sort(a),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;};var avg=function(a){return a.reduce(function(x,y){return x+y;},0)/a.length;};var p25=function(a){var s=sort(a);return s[Math.floor(s.length*0.25)];};var p75=function(a){var s=sort(a);return s[Math.floor(s.length*0.75)];};return{evRevStats:{mean:avg(evR),median:med(evR),p25:p25(evR),p75:p75(evR)},revGrowthStats:{mean:avg(rG),median:med(rG)}};},[selComps]);
  function buildSens(scKey){var sc=scenarios[scKey];return sensW.map(function(w){return{wacc:w,values:sensT.map(function(tg){var rr=bgs(sc.revMode,sc.revGrowthStart,sc.revGrowthEnd,projYrs);var fr=bgs(sc.fcfMode,sc.fcfMarginStart,sc.fcfMarginEnd,projYrs+1);var revs=pRev(baseRev*1e6,rr);var fcfs=pFCF(revs,fr);var r=cDCF(fcfs,w,tg);return(r.enterpriseValue+netCashAdj*1e6)/(shares*1e6);})};});}
  var sensAll=useMemo(function(){return{bear:buildSens("bear"),base:buildSens("base"),bull:buildSens("bull")};},[scenarios,sensW,sensT,projYrs,baseRev,netCashAdj,shares]);
  var football=useMemo(function(){var rows=Object.entries(dcfR).map(function(p){var k=p[0],r=p[1],pp=r.pricePerShare;return{method:"DCF - "+PRESETS[k].label,low:pp*0.9,mid:pp,high:pp*1.1,color:PRESETS[k].color};});if(compsA){var ntmR=baseRes.ntmRev;var rL=compsA.evRevStats.p25*ntmR;var rH=compsA.evRevStats.p75*ntmR;var rLps=(rL+netCashAdj*1e6)/(shares*1e6);var rHps=(rH+netCashAdj*1e6)/(shares*1e6);rows.push({method:"Comps (25th-75th)",low:Math.min(rLps,rHps),mid:(rLps+rHps)/2,high:Math.max(rLps,rHps),color:C.purple});var mL=compsA.evRevStats.mean;var mM=compsA.evRevStats.median;var mLps=(mL*ntmR+netCashAdj*1e6)/(shares*1e6);var mMps=(mM*ntmR+netCashAdj*1e6)/(shares*1e6);rows.push({method:"Comps (Mean/Med)",low:Math.min(mLps,mMps),mid:(mLps+mMps)/2,high:Math.max(mLps,mMps),color:C.orange});}return rows;},[dcfR,compsA,netCashAdj,shares,baseRes]);
  var sc=scenarios[activeSc];var res=dcfR[activeSc];

  async function exportAllPDF(){setExporting(true);var tabs=["dcf","comps","sensitivity","summary"];var origTab=tab;var pdf=new jspdf.jsPDF({orientation:"l",unit:"px",format:[1200,800]});for(var i=0;i<tabs.length;i++){setTab(tabs[i]);await new Promise(function(r){setTimeout(r,700);});var el=document.getElementById("main-content");if(!el)continue;var oH=el.style.height;var oO=el.style.overflow;el.style.height="auto";el.style.overflow="visible";try{var canvas=await html2canvas(el,{backgroundColor:"#111",scale:1.5,useCORS:true,logging:false,windowWidth:el.scrollWidth,windowHeight:el.scrollHeight});if(i>0)pdf.addPage([1200,800],"l");pdf.addImage(canvas.toDataURL("image/png"),"PNG",0,0,1200,Math.min(canvas.height/(canvas.width/1200),800));}catch(e){}el.style.height=oH;el.style.overflow=oO;}pdf.save("workiva_valuation.pdf");setTab(origTab);setExporting(false);}

  function NavLink({label,onClick,active}){return <button onClick={onClick} style={{background:"none",border:"none",color:active?C.blue:C.textDim,fontFamily:ff,fontSize:12,fontWeight:active?700:600,letterSpacing:"0.06em",textTransform:"uppercase",padding:"10px 20px",borderBottom:active?"3px solid "+C.blue:"3px solid transparent",cursor:"pointer",transition:"all 0.2s"}}>{label}</button>;}

  var allTabs=["home","dcf","comps","sensitivity","summary","notes"];
  var tabLabels={home:"Home",dcf:"DCF Model",comps:"Comparables",sensitivity:"Sensitivity",summary:"Summary",notes:"Notes"};

  return(
    <div style={{background:C.bg,minHeight:"100vh",fontFamily:ff,color:C.text}}>
      <style>{`
        input[type=range]{-webkit-appearance:none;appearance:none;background:${C.border};height:4px;border-radius:2px}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:${C.blue};cursor:pointer}
        input[type=checkbox]{accent-color:${C.blue}}
        ::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:${C.bg}}::-webkit-scrollbar-thumb{background:#444;border-radius:3px}
        .sc-btn{background:none;border:2px solid ${C.border};cursor:pointer;font-family:${ff};font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:6px 16px;border-radius:6px;transition:all 0.15s}
        table{border-collapse:collapse;width:100%}
        th{color:${C.textSec};font-size:10px;font-family:${ff};font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:8px;text-align:right;border-bottom:2px solid ${C.border}}
        th:first-child{text-align:left}
        td{color:${C.text};font-size:11px;font-family:${ff};font-weight:500;padding:7px 8px;text-align:right;border-bottom:1px solid ${C.border}22}
        td:first-child{text-align:left;color:${C.textSec}}
        tr:hover td{background:${C.surface2}}
        .ci{background:${C.bg};border:1px solid ${C.border};color:${C.text};border-radius:6px;padding:4px 7px;width:100%;font-size:11px;outline:none;font-family:${ff};font-weight:500;text-align:right}
      `}</style>

      {/* HEADER */}
      <div style={{background:"linear-gradient(135deg,#1a1a1a,#222)",borderBottom:"1px solid #333",padding:"0 28px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",height:56}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}><div style={{width:26,height:26,borderRadius:6,background:"linear-gradient(135deg,"+C.blue+",#00AAFF)",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{color:"#fff",fontSize:13,fontWeight:900}}>W</span></div><span style={{color:"#ccc",fontSize:10,fontWeight:700,letterSpacing:"0.15em",textTransform:"uppercase"}}>Valuation Engine</span></div>
            <input value={coName} onChange={function(e){setCoName(e.target.value);}} style={{background:"none",border:"none",color:C.text,fontSize:20,fontWeight:800,outline:"none",width:180,fontFamily:ff}}/>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {(tab!=="home"&&tab!=="notes")&&<button onClick={exportAllPDF} disabled={exporting} style={{background:C.blue,border:"none",color:"#fff",borderRadius:6,padding:"7px 16px",cursor:"pointer",fontFamily:ff,fontSize:11,fontWeight:700,opacity:exporting?0.5:1}}>{exporting?"Exporting...":"Export PDF"}</button>}
            {(tab!=="home"&&tab!=="notes")&&Object.entries(PRESETS).map(function(p){var k=p[0],pr=p[1];return <button key={k} className="sc-btn" style={{borderColor:activeSc===k?pr.color:C.border,color:activeSc===k?pr.color:C.textDim,background:activeSc===k?pr.color+"15":"none"}} onClick={function(){setActiveSc(k);}}>{pr.label}</button>;})}
          </div>
        </div>
        <div style={{display:"flex"}}>{allTabs.map(function(t){return <NavLink key={t} label={tabLabels[t]} onClick={function(){setTab(t);}} active={tab===t}/>;})}</div>
      </div>

                {h:"Terminal Value",b:"Calculated using the Gordon Growth Model: TV = FCF(final year) \u00d7 (1 + g) / (WACC - g), where g is the terminal growth rate. The terminal value is discounted back to present at the WACC rate."},
